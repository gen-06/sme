spring:
  application:
    name: sme-credit-scoring-platform

  autoconfigure:
    exclude:
      # We authenticate via ApiKeyAuthFilter, not Spring Security's default
      # username/password store — without this exclusion Boot still stands up an
      # in-memory user with a randomly generated password on every startup.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/credit_scoring
    username: credit_scoring
    password: credit_scoring_dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

app:
  ingestion:
    mock-mobile-money:
      window-months: 6
      monthly-transaction-count-min: 8
      monthly-transaction-count-max: 40
      monthly-inflow-min: 50000
      monthly-inflow-max: 400000
      growth-bias: 0.03
      failure-rate: 0.06
      guaranteed-gap-month: true

  scoring:
    active-version: rule-based-v1
    rule-based-v1:
      weights:
        transaction-volume: 0.30
        consistency: 0.30
        growth-trend: 0.25
        missed-payment-signal: 0.15

  batch:
    sync-cron: "0 0 */6 * * *"

  oauth2:
    # Access-token lifetime for the client_credentials grant. Kept deliberately short:
    # this grant issues no refresh token, and there is no way to revoke a single token
    # without suspending its whole consumer (see README's Known limitations), so natural
    # expiry is the main bound on how long a leaked token stays useful.
    access-token-ttl-minutes: 60
    # Every hour at :30 — offset from app.batch.sync-cron (every 6 hours on the hour) so
    # the two scheduled jobs don't contend for the same moment.
    authorization-cleanup-cron: "0 30 * * * *"
    # After PATCH /consumers/{id}/rotate-secret, the old secret keeps authenticating for
    # this long (grace period for updating deployed clients) before it's dropped.
    secret-rotation-grace-period-hours: 24

  admin:
    # Local-dev default matches this project's existing low-ceremony pattern (the
    # demo API key is likewise just logged at startup, not console-issued). Override
    # via the PLATFORM_ADMIN_TOKEN env var for anything beyond a laptop.
    platform-admin-token: ${PLATFORM_ADMIN_TOKEN:local-dev-admin-token}

management:
  endpoints:
    web:
      exposure:
        # Only health — this endpoint is fully unauthenticated (SecurityConfig's
        # publicFilterChain permits it to anyone), so nothing else in actuator's
        # surface (env, beans, config props, etc.) should ever be reachable here.
        include: health
  endpoint:
    health:
      # Never show component-level detail (DB connectivity, disk paths) to an
      # anonymous caller. There is no "authorized" caller on this endpoint's security
      # chain to make when-authorized meaningfully different from never.
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.creditscore.platform: INFO
