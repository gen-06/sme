spring:
  application:
    name: sme-credit-scoring-platform

  # Docker/Kubernetes-secret idiom: each file under /run/secrets/ becomes a property
  # (filename -> dotted key, content -> value), overriding whatever's set below.
  # "optional:" makes this a silent no-op when the directory doesn't exist, so plain
  # ./mvnw spring-boot:run (no Docker) is unaffected and keeps using the literal
  # defaults in this file — see docker-compose.yml's secrets: block and README.
  config:
    import: "optional:configtree:/run/secrets/"

  autoconfigure:
    exclude:
      # We authenticate via ApiKeyAuthFilter, not Spring Security's default
      # username/password store — without this exclusion Boot still stands up an
      # in-memory user with a randomly generated password on every startup.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/credit_scoring
    username: credit_scoring
    password: credit_scoring_dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

  lifecycle:
    # How long Tomcat waits for in-flight requests to finish on SIGTERM before giving
    # up (server.shutdown: graceful, below, is what enables the wait at all). Must stay
    # under docker-compose.yml's app service's stop_grace_period (25s) — otherwise
    # Docker's SIGKILL fires first and this timeout never gets to matter.
    timeout-per-shutdown-phase: 20s

# Graceful: on SIGTERM, stop accepting new requests but let in-flight ones finish
# (bounded by spring.lifecycle.timeout-per-shutdown-phase above) instead of dropping
# them mid-response.
server:
  shutdown: graceful

app:
  ingestion:
    mock-mobile-money:
      window-months: 6
      monthly-transaction-count-min: 8
      monthly-transaction-count-max: 40
      monthly-inflow-min: 50000
      monthly-inflow-max: 400000
      growth-bias: 0.03
      failure-rate: 0.06
      guaranteed-gap-month: true

  scoring:
    active-version: rule-based-v1
    rule-based-v1:
      weights:
        transaction-volume: 0.30
        consistency: 0.30
        growth-trend: 0.25
        missed-payment-signal: 0.15

  batch:
    sync-cron: "0 0 */6 * * *"

  oauth2:
    # Access-token lifetime for the client_credentials grant. Kept deliberately short:
    # this grant issues no refresh token, and there is no way to revoke a single token
    # without suspending its whole consumer (see README's Known limitations), so natural
    # expiry is the main bound on how long a leaked token stays useful.
    access-token-ttl-minutes: 60
    # Every hour at :30 — offset from app.batch.sync-cron (every 6 hours on the hour) so
    # the two scheduled jobs don't contend for the same moment.
    authorization-cleanup-cron: "0 30 * * * *"
    # After PATCH /consumers/{id}/rotate-secret, the old secret keeps authenticating for
    # this long (grace period for updating deployed clients) before it's dropped.
    secret-rotation-grace-period-hours: 24

  admin:
    # Local-dev default matches this project's existing low-ceremony pattern (the
    # demo API key is likewise just logged at startup, not console-issued). Override
    # via the PLATFORM_ADMIN_TOKEN env var for anything beyond a laptop.
    platform-admin-token: ${PLATFORM_ADMIN_TOKEN:local-dev-admin-token}

  rate-limit:
    # Per-consumer ceiling on /api/**, enforced in-memory per instance (see README's
    # Known limitations for the multi-instance caveat). Generous enough that the demo
    # script/Postman collection never hits it; a real deployment tunes this per traffic.
    requests-per-minute: 300

management:
  endpoints:
    web:
      exposure:
        # health is fully unauthenticated (SecurityConfig's publicFilterChain permits it
        # to anyone); prometheus requires PLATFORM_ADMIN_TOKEN (SecurityConfig's
        # metricsFilterChain). Nothing else in actuator's surface (env, beans, config
        # props, etc.) should ever be reachable here.
        include: health,prometheus
  endpoint:
    health:
      # Never show component-level detail (DB connectivity, disk paths) to an
      # anonymous caller. There is no "authorized" caller on this endpoint's security
      # chain to make when-authorized meaningfully different from never.
      show-details: never
  metrics:
    tags:
      application: sme-credit-scoring-platform

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.creditscore.platform: INFO
