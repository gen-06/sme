services:
  postgres:
    image: postgres:16-alpine
    container_name: credit-scoring-postgres
    environment:
      POSTGRES_DB: credit_scoring
      POSTGRES_USER: credit_scoring
      # The official Postgres image's entrypoint natively supports the _FILE suffix:
      # it reads the password from this file instead of taking it as a plain env var.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_scoring"]
      interval: 5s
      timeout: 5s
      retries: 5

  # redis:
  #   image: redis:7-alpine
  #   container_name: credit-scoring-redis
  #   ports:
  #     - "6379:6379"
  #   # Placeholder for future score-caching layer. Not wired into the app yet.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit-scoring-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/credit_scoring
      SPRING_DATASOURCE_USERNAME: credit_scoring
      SPRING_PROFILES_ACTIVE: seed
    # Mounted as files under /run/secrets/, one per line below, named after the exact
    # dotted Spring property they set — application.yml's
    # spring.config.import=optional:configtree:/run/secrets/ reads each file's name as
    # a property key and its content as the value. Neither secret is a plain env var
    # inside this container (docker inspect's Config.Env carries no plaintext value).
    secrets:
      - source: postgres_password
        target: spring.datasource.password
      - source: platform_admin_token
        target: app.admin.platform-admin-token
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: ["full"]

volumes:
  postgres-data:

# Local file-based secrets (see secrets/*.txt.example) — the same idiom Docker Swarm
# and Kubernetes both use (a secret mounted as a file), so this carries forward
# unchanged if this app is ever deployed to either. Real values live in secrets/*.txt,
# gitignored; the committed *.example templates hold today's same dev-only
# placeholders so a fresh clone's local workflow needs only a one-time copy step (see
# README) and otherwise behaves exactly as before.
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  platform_admin_token:
    file: ./secrets/platform_admin_token.txt
