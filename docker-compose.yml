services:
  postgres:
    image: postgres:16-alpine
    container_name: credit-scoring-postgres
    environment:
      POSTGRES_DB: credit_scoring
      POSTGRES_USER: credit_scoring
      POSTGRES_PASSWORD: credit_scoring_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_scoring"]
      interval: 5s
      timeout: 5s
      retries: 5

  # redis:
  #   image: redis:7-alpine
  #   container_name: credit-scoring-redis
  #   ports:
  #     - "6379:6379"
  #   # Placeholder for future score-caching layer. Not wired into the app yet.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit-scoring-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/credit_scoring
      SPRING_DATASOURCE_USERNAME: credit_scoring
      SPRING_DATASOURCE_PASSWORD: credit_scoring_dev
      SPRING_PROFILES_ACTIVE: seed
    ports:
      - "8080:8080"
    profiles: ["full"]

volumes:
  postgres-data:
